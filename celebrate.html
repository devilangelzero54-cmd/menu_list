<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spring Gallery</title>
  <style>
    body {
      background: linear-gradient(to bottom, #ffe6f0, #e6f7ff); /* 桜＋春空グラデ */
      color: #5a6a7a;
      font-family: "Noto Sans JP", sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #ff8fb1; /* 桜ピンク */
    }

    .gallery-container {
      position: relative;
      overflow-x: auto;
      display: flex;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      width: 100%;
    }

    .gallery-container img {
      flex: 0 0 100%;
      width: 100%;
      height: auto;
      scroll-snap-align: center;
      object-fit: contain;
    }

    footer {
      color: #7aaac7; /* 春空ブルー */
      font-size: 1rem;
      margin: 10px 0 30px 0;
    }
  </style>
</head>
<body>
  <!-- 白フラッシュ用 -->
<div class="flash-in" id="flashIn"></div>

<style>
  .flash-in {
  position: fixed;
  inset: 0;
  background: #fff0f5;
  opacity: 1;
  pointer-events: none;
  transition: opacity 0.6s ease;
  z-index: 9999; /* すべての要素の上に */
}
.flash-in.off {
  opacity: 0;
}
</style>

<script>
window.addEventListener('load', () => {
  const f = document.getElementById('flashIn');
  setTimeout(() => f.classList.add('off'), 50);
  setTimeout(() => f.remove(), 800);
});
</script>
  <h1>🌸 お祝いイラスト 🌸</h1>
  <div class="gallery-container" id="gallery">
    <img src="images/celebration_001.jpg" alt="祝1">
    <img src="images/celebration_002.jpg" alt="祝2">
    <img src="images/celebration_003.jpg" alt="祝3">
    <img src="images/celebration_004.jpg" alt="祝4">
    <img src="images/celebration_005.jpg" alt="祝5">
    <img src="images/celebration_006.jpg" alt="祝6">
    <img src="images/celebration_007.jpg" alt="祝7">
    <img src="images/celebration_008.jpg" alt="祝8">
    <img src="images/celebration_009.jpg" alt="祝9">
    <img src="images/celebration_010.jpg" alt="祝10">
    <img src="images/celebration_011.jpg" alt="祝11">
    <img src="images/celebration_012.jpg" alt="祝12">
    <img src="images/celebration_013.jpg" alt="祝13">
    <img src="images/celebration_014.jpg" alt="祝14">
    <img src="images/celebration_015.jpg" alt="祝15">

  </div>
  <footer>🌸 期間限定・お祝いイラスト 🌸</footer>

  <script>
    const gallery = document.getElementById("gallery");
    let index = 0;

    setInterval(() => {
      index = (index + 1) % gallery.children.length;
      gallery.scrollTo({
        left: gallery.children[index].offsetLeft,
        behavior: "smooth"
      });
    }, 3000); // 3秒で自動スライド
  </script>
</body>
</html>
